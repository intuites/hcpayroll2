<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Weekly Reports</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">Intuites Healthcare Staffing</a>
        <nav class="main-nav">
          <a href="index.html">Add Candidate</a>
          <a href="upload.html">Upload</a>
          <a href="reports.html" class="active">Reports</a>
          <button type="button" class="nav-logout" id="logoutBtn">Logout</button>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card form-card" aria-labelledby="weekly-reports">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
          "
        >
          <h1 id="weekly-reports" style="margin: 0">Weekly Reports</h1>
          <button id="refreshReportsBtn" type="button" class="btn primary">
            Refresh Reports
          </button>
        </div>
        <p style="margin: 8px 0 0; color: #475569">
          Weekly net profit report for every week from Supabase timesheet rows.
        </p>
        <p id="reportsStatus" style="margin: 12px 0 0; color: #475569"></p>
      </section>

      <section class="card" aria-labelledby="weekly-summary">
        <h2 id="weekly-summary" style="margin-top: 0">All Weeks</h2>
        <div style="overflow-x: auto">
          <table class="weekly-report-table" id="weeklySummaryTable">
            <thead>
              <tr>
                <th>Week Ending</th>
                <th style="text-align: right">Candidates</th>
                <th style="text-align: right">Total Net Profit</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="3">No data loaded.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="card" aria-labelledby="weekly-details">
        <h2 id="weekly-details" style="margin-top: 0">Week Details</h2>
        <div id="weeklyDetails"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">&copy; <span id="year"></span> Intuites Healthcare Staffing</div>
    </footer>

    <script type="module">
      import { protectPage, setupLogoutButton } from "./auth.js";
      import { supabase } from "./supabase.js";

      await protectPage();
      setupLogoutButton();

      document.getElementById("year").textContent = new Date().getFullYear();

      const statusEl = document.getElementById("reportsStatus");
      const summaryBody = document.querySelector("#weeklySummaryTable tbody");
      const detailsEl = document.getElementById("weeklyDetails");
      const refreshBtn = document.getElementById("refreshReportsBtn");

      function normalizeName(value) {
        return String(value || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function buildNameKeys(value) {
        const keys = new Set();
        const normalized = normalizeName(value);
        if (normalized) keys.add(normalized);

        const commaNormalized = normalizeCommaName(value);
        if (commaNormalized) keys.add(commaNormalized);

        const parts = normalized.split(" ").filter(Boolean);
        if (parts.length >= 2) {
          keys.add(`${parts.slice(1).join(" ")} ${parts[0]}`.trim());
          keys.add(`${parts[parts.length - 1]} ${parts.slice(0, -1).join(" ")}`.trim());
        }

        return Array.from(keys).filter(Boolean);
      }

      function normalizeCommaName(value) {
        const raw = String(value || "");
        if (!raw.includes(",")) return normalizeName(raw);
        const parts = raw.split(",");
        const last = (parts[0] || "").trim();
        const first = (parts[1] || "").trim();
        return normalizeName(`${first} ${last}`);
      }

      function round2(value) {
        const n = Number(value);
        return Number.isFinite(n)
          ? Math.round((n + Number.EPSILON) * 100) / 100
          : 0;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(Number(value || 0));
      }

      function buildCandidateLookup(candidates) {
        const byUuid = new Map();
        const byNormalized = new Map();

        (candidates || []).forEach((candidate) => {
          if (candidate?.candidate_uuid) {
            byUuid.set(candidate.candidate_uuid, candidate);
          }

          buildNameKeys(candidate?.candidate_name).forEach((key) => {
            byNormalized.set(key, candidate);
          });
        });

        return { byUuid, byNormalized };
      }

      function findCandidateBase(lookup, parsedRow) {
        const candidateUuid = String(parsedRow?.candidate_uuid || "").trim();
        if (candidateUuid && lookup.byUuid.has(candidateUuid)) {
          return lookup.byUuid.get(candidateUuid);
        }

        for (const key of buildNameKeys(parsedRow?.candidate_name)) {
          if (lookup.byNormalized.has(key)) {
            return lookup.byNormalized.get(key);
          }
        }
        return null;
      }

      function calcNetProfit(base, row) {
        const toNum = (value) => {
          const n = Number(value);
          return Number.isNaN(n) ? 0 : n;
        };
        const VMS_RATE = 0.06;

        const reg = toNum(row?.reg_hours);
        const ot = toNum(row?.ot_hours);
        const holiday = toNum(row?.holiday_hours);

        const w2 = toNum(base?.w2_rate);
        const stipend = toNum(base?.stipend_rate);
        const otPayRate = toNum(base?.ot_rate);
        const holidayPayRate = toNum(base?.holiday_rate || base?.ot_rate);

        const standardW2Amount = reg * w2;
        const otAmount = ot * otPayRate;
        const standardStipendAmount = reg * stipend;

        const clientStdRate = toNum(
          base?.client_standard_bill_rate ?? row?.reg_rate
        );
        const clientOtRate = toNum(base?.client_ot_bill_rate ?? row?.ot_rate);
        const clientHolidayRate = toNum(
          base?.client_holiday_bill_rate ?? row?.holiday_rate
        );

        const clientStandardAmount = reg * clientStdRate * (1 - VMS_RATE);
        const clientOtHolidayAmount =
          ot * (clientOtRate - VMS_RATE * clientOtRate) +
          holiday * (clientHolidayRate - VMS_RATE * clientHolidayRate);
        const totalReceived = clientStandardAmount + clientOtHolidayAmount;

        const totalCandidateExpense =
          (standardW2Amount + otAmount) * 1.2 + standardStipendAmount;
        return round2(totalReceived - totalCandidateExpense);
      }

      function getWeekEnding(row) {
        const endDate = String(row?.end_date || "").trim();
        if (endDate) return endDate;
        return String(row?.week_ending || "").trim();
      }

      function renderSummary(weeks) {
        if (!weeks.length) {
          summaryBody.innerHTML = `
            <tr><td colspan="3">No weekly rows found in Supabase.</td></tr>
          `;
          return;
        }

        summaryBody.innerHTML = weeks
          .map(
            (week) => `
            <tr>
              <td>${escapeHtml(week.week_ending)}</td>
              <td style="text-align:right;">${week.candidate_count}</td>
              <td style="text-align:right;">${formatCurrency(week.total_net_profit)}</td>
            </tr>
          `
          )
          .join("");
      }

      function renderDetails(weeks) {
        if (!weeks.length) {
          detailsEl.innerHTML = "";
          return;
        }

        detailsEl.innerHTML = weeks
          .map((week) => {
            const rowsHtml = week.rows
              .map(
                (row) => `
                <tr>
                  <td>${escapeHtml(row.candidate_name || "")}</td>
                  <td style="text-align:right;">${formatCurrency(row.net_profit)}</td>
                </tr>
              `
              )
              .join("");

            return `
              <details class="weekly-report-card weekly-report-dropdown" style="margin-bottom:14px;">
                <summary class="weekly-report-header">
                  <div><strong>Week Ending:</strong> ${escapeHtml(week.week_ending)}</div>
                  <div><strong>Candidates:</strong> ${week.candidate_count}</div>
                  <div><strong>Total Net Profit:</strong> ${formatCurrency(week.total_net_profit)}</div>
                </summary>
                <div class="weekly-report-content" style="overflow-x:auto;">
                  <table class="weekly-report-table">
                    <thead>
                      <tr>
                        <th>Candidate Name</th>
                        <th style="text-align:right;">Net Profit</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${
                        rowsHtml ||
                        '<tr><td colspan="2" style="text-align:center;">No candidates for this week.</td></tr>'
                      }
                    </tbody>
                  </table>
                </div>
              </details>
            `;
          })
          .join("");
      }

      function buildWeeklyReport(parsedRows, candidates) {
        const lookup = buildCandidateLookup(candidates || []);
        const weeks = new Map();

        (parsedRows || []).forEach((parsedRow) => {
          const weekEnding = getWeekEnding(parsedRow);
          if (!weekEnding) return;

          const base = findCandidateBase(lookup, parsedRow) || {};
          const candidateUuid = base?.candidate_uuid || parsedRow?.candidate_uuid || null;
          const candidateName =
            base?.candidate_name || String(parsedRow?.candidate_name || "").trim();
          const candidateKey =
            candidateUuid || `name:${normalizeName(candidateName) || "unknown"}`;
          const netProfit = calcNetProfit(base, parsedRow);

          if (!weeks.has(weekEnding)) {
            weeks.set(weekEnding, {
              week_ending: weekEnding,
              rowsByCandidate: new Map(),
            });
          }

          const weekBucket = weeks.get(weekEnding);
          const existing = weekBucket.rowsByCandidate.get(candidateKey) || {
            candidate_uuid: candidateUuid,
            candidate_name: candidateName,
            net_profit: 0,
          };
          existing.net_profit += Number(netProfit || 0);
          weekBucket.rowsByCandidate.set(candidateKey, existing);
        });

        return Array.from(weeks.values())
          .map((week) => {
            const rows = Array.from(week.rowsByCandidate.values())
              .map((row) => ({ ...row, net_profit: round2(row.net_profit) }))
              .sort((a, b) =>
                String(a.candidate_name).localeCompare(String(b.candidate_name))
              );
            const totalNetProfit = round2(
              rows.reduce((sum, row) => sum + Number(row.net_profit || 0), 0)
            );
            return {
              week_ending: week.week_ending,
              candidate_count: rows.length,
              rows,
              total_net_profit: totalNetProfit,
            };
          })
          .sort((a, b) => String(b.week_ending).localeCompare(String(a.week_ending)));
      }

      async function loadReports() {
        refreshBtn.disabled = true;
        refreshBtn.textContent = "Loading...";
        statusEl.style.color = "#475569";
        statusEl.textContent = "Loading weekly reports from Supabase...";

        try {
          const [{ data: parsedRows, error: parsedError }, { data: candidates, error: candidatesError }] =
            await Promise.all([
              supabase
                .from("parsed_timesheet_rows")
                .select(
                  "candidate_uuid,candidate_name,reg_hours,ot_hours,holiday_hours,reg_rate,ot_rate,holiday_rate,start_date,end_date"
                )
                .order("end_date", { ascending: false }),
              supabase
                .from("candidate_data")
                .select(
                  "candidate_uuid,candidate_name,w2_rate,stipend_rate,ot_rate,holiday_rate,client_standard_bill_rate,client_ot_bill_rate,client_holiday_bill_rate"
                ),
            ]);

          if (parsedError) throw parsedError;
          if (candidatesError) throw candidatesError;

          const weeklyReport = buildWeeklyReport(parsedRows || [], candidates || []);
          renderSummary(weeklyReport);
          renderDetails(weeklyReport);

          statusEl.style.color = "#166534";
          statusEl.textContent = `Loaded ${weeklyReport.length} week(s) from Supabase.`;
        } catch (error) {
          summaryBody.innerHTML = `<tr><td colspan="3">Failed to load reports.</td></tr>`;
          detailsEl.innerHTML = "";
          statusEl.style.color = "#b91c1c";
          statusEl.textContent = `Error: ${error.message}`;
        } finally {
          refreshBtn.disabled = false;
          refreshBtn.textContent = "Refresh Reports";
        }
      }

      refreshBtn.addEventListener("click", loadReports);
      loadReports();
    </script>

    <style>
      .weekly-report-card {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #fff;
      }

      .weekly-report-header {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        padding: 12px 14px;
        color: #0f172a;
        font-size: 14px;
        cursor: pointer;
        align-items: center;
      }

      .weekly-report-dropdown .weekly-report-header {
        list-style: none;
      }

      .weekly-report-dropdown .weekly-report-header::-webkit-details-marker {
        display: none;
      }

      .weekly-report-dropdown .weekly-report-header::before {
        content: "▸";
        color: #334155;
        font-size: 14px;
      }

      .weekly-report-dropdown[open] .weekly-report-header {
        border-bottom: 1px solid #e2e8f0;
      }

      .weekly-report-dropdown[open] .weekly-report-header::before {
        content: "▾";
      }

      .weekly-report-content {
        padding-top: 2px;
      }

      .weekly-report-table {
        width: 100%;
        min-width: 700px;
        border-collapse: collapse;
      }

      .weekly-report-table th,
      .weekly-report-table td {
        padding: 10px 12px;
        border-bottom: 1px solid #eef2f7;
        white-space: nowrap;
      }

      .weekly-report-table thead th {
        background: #f8fafc;
        color: #64748b;
        font-size: 12px;
        text-transform: uppercase;
      }
    </style>
  </body>
</html>
