<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Candidate Entry</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>             
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">Intuites Healthcare Staffing</a>
        <nav class="main-nav">
          <a href="index.html">Add Candidate</a>
          <a href="upload.html">Upload</a>
          <a href="reports.html">Reports</a>
          <button type="button" class="nav-logout" id="logoutBtn">Logout</button>
        </nav>
      </div>
    </header>
                              
    <main class="container">
      <section class="card form-card" aria-labelledby="add-candidate">
        <h1 id="add-candidate">Add Candidate</h1>

        <form id="candidateForm" class="grid-form">
          <div class="field">
            <label for="candidate_name">Candidate Name</label>
            <input
              id="candidate_name"
              name="candidate_name"
              placeholder="Full name"
              required
            />
          </div>
          <div class="field">
            <label for="start_date">Start Date</label>
            <input id="start_date" type="date" name="start_date" required />
          </div>

          <div class="field">
            <label for="end_date">End Date</label>
            <input id="end_date" type="date" name="end_date" required />
          </div>

          <div class="field">
            <label for="position">Position</label>
            <input id="position" name="position" placeholder="e.g., nurse" />
          </div>

          <div class="field">
            <label for="work_location">Work Location</label>
            <input
              id="work_location"
              name="work_location"
              placeholder="Site or Address"
            />
          </div>
 
          <div class="field">
            <label for="client">Client</label>
            <input id="client" name="client" placeholder="Client name" />
          </div>

          <div class="field">
            <label for="shift">Shift</label>
            <input id="shift" name="shift" placeholder="e.g., Day / Night" />
          </div>

          <div class="field">
            <label for="hours">Hours</label>
            <input
              id="hours"
              type="number"
              name="hours"
              placeholder="Hours per week"
            />
          </div>

          <div class="field">
            <label for="w2_rate">Regular Rate</label>
            <input
              id="w2_rate"
              type="number"
              step="0.01"
              name="w2_rate"
              placeholder="Hourly rate"
            />
          </div>

          <div class="field">
            <label for="ot_rate">OT Rate</label>
            <input
              id="ot_rate"
              type="number"
              step="0.01"
              name="ot_rate"
              placeholder="Overtime rate"
            />
          </div>

          <div class="field">
            <label for="holiday_rate">Holiday Rate</label>
            <input
              id="holiday_rate"
              type="number"
              step="0.01"
              name="holiday_rate"
              placeholder="Holiday rate"
            />
          </div>

          <div class="field">
            <label for="sign_bonus">Sign Bonus</label>
            <input
              id="sign_bonus"
              type="number"
              step="0.01"
              name="sign_bonus"
              placeholder="Optional"
            />
          </div>

          <div class="field">
            <label for="stipend_rate">Stipend Rate</label>
            <input
              id="stipend_rate"
              type="number"
              step="0.01"
              name="stipend_rate"
              placeholder="Stipend rate"
            />
          </div>

          <div class="field">
            <label for="client_standard_bill_rate"
              >Client Standard Bill Rate</label
            >
            <input
              id="client_standard_bill_rate"
              type="number"
              step="0.01"
              name="client_standard_bill_rate"
              placeholder="Standard bill rate"
            />
          </div>

          <div class="field">
            <label for="client_ot_bill_rate">Client OT Bill Rate</label>
            <input
              id="client_ot_bill_rate"
              type="number"
              step="0.01"
              name="client_ot_bill_rate"
              placeholder="OT bill rate"
            />
          </div>

          <div class="field">
            <label for="client_holiday_bill_rate"
              >Client Holiday Bill Rate</label
            >
            <input
              id="client_holiday_bill_rate"
              type="number"
              step="0.01"
              name="client_holiday_bill_rate"
              placeholder="Holiday bill rate"
            />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn primary">Add Candidate</button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="all-candidates">
        <h2 id="all-candidates" style="margin-top: 0">All Candidates </h2>
        <p id="candidatesStatus" style="margin: 0 0 12px; color: #475569"></p>
        <div class="candidates-editor-wrap">
          <table class="candidates-editor-table" id="candidatesTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Start</th>
                <th>End</th>
                <th>Position</th>
                <th>Work Location</th>
                <th>Client</th>
                <th>Shift</th>
                <th>Hours</th>
                <th>Reg Rate</th>
                <th>OT Rate</th>
                <th>Holiday Rate</th>
                <th>Sign Bonus</th>
                <th>Stipend</th>
                <th>Client Std</th>
                <th>Client OT</th>
                <th>Client Holiday</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">© <span id="year"></span> Intuites Healthcare Staffing</div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
    <script type="module">
      import { protectPage, setupLogoutButton } from "./auth.js";

      await protectPage();
      setupLogoutButton();

      const isLocalHost =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1";
      const PROD_API_URL = window.location.hostname.endsWith(".vercel.app")
        ? `${window.location.origin}/api`
        : "https://hcpayrollreports.vercel.app/api";
      const API_URL = isLocalHost ? "http://localhost:5000/api" : PROD_API_URL;
      const form = document.getElementById("candidateForm");
      const candidatesTable = document.querySelector("#candidatesTable tbody");
      const candidatesStatus = document.getElementById("candidatesStatus");
      let candidateRows = [];

      const EDITABLE_FIELDS = [
        ["candidate_name", "text"],
        ["start_date", "date"],
        ["end_date", "date"],
        ["position", "text"],
        ["work_location", "text"],
        ["client", "text"],
        ["shift", "text"],
        ["hours", "number"],
        ["w2_rate", "number"],
        ["ot_rate", "number"],
        ["holiday_rate", "number"],
        ["sign_bonus", "number"],
        ["stipend_rate", "number"],
        ["client_standard_bill_rate", "number"],
        ["client_ot_bill_rate", "number"],
        ["client_holiday_bill_rate", "number"],
      ];

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function parseValue(type, value) {
        if (type === "number") {
          if (value === "" || value === null || value === undefined) return null;
          const n = Number(value);
          return Number.isNaN(n) ? null : n;
        }
        return String(value ?? "").trim();
      }

      function renderCandidates() {
        candidatesTable.innerHTML = candidateRows
          .map(
            (row, index) => `
              <tr data-row-index="${index}">
                ${EDITABLE_FIELDS.map(([key, type]) => `
                  <td>
                    <input
                      class="candidate-cell-input"
                      data-key="${key}"
                      data-type="${type}"
                      type="${type}"
                      value="${escapeHtml(row[key] ?? "")}"
                    />
                  </td>
                `).join("")}
                <td>
                  <button type="button" class="btn secondary candidate-save-btn" data-action="save-row">Save</button>
                </td>
              </tr>
            `
          )
          .join("");
      }

      async function loadCandidates() {
        candidatesStatus.textContent = "Loading candidates...";
        const res = await fetch(`${API_URL}/candidates`);
        const data = await res.json();
        if (!res.ok || !Array.isArray(data)) {
          throw new Error(data?.error || "Failed to load candidates");
        }
        candidateRows = data;
        renderCandidates();
        candidatesStatus.textContent = `${candidateRows.length} candidate(s) loaded.`;
      }

      async function saveCandidateRow(tr) {
        const rowIndex = Number(tr.dataset.rowIndex);
        const base = candidateRows[rowIndex];
        if (!base?.candidate_uuid) return;

        const updates = {};
        tr.querySelectorAll("input[data-key]").forEach((input) => {
          const key = input.dataset.key;
          const type = input.dataset.type;
          updates[key] = parseValue(type, input.value);
        });

        const res = await fetch(`${API_URL}/candidates`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            candidate_uuid: base.candidate_uuid,
            updates,
          }),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data?.error || "Failed to update candidate");
        }

        candidateRows[rowIndex] = data;
        candidatesStatus.textContent = `Updated: ${data.candidate_name}`;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);
        const data = Object.fromEntries(formData);

        data.hours = data.hours ? parseInt(data.hours) : null;
        data.w2_rate = data.w2_rate ? parseFloat(data.w2_rate) : null;
        data.ot_rate = data.ot_rate ? parseFloat(data.ot_rate) : null;
        data.holiday_rate = data.holiday_rate
          ? parseFloat(data.holiday_rate)
          : null;
        data.sign_bonus = data.sign_bonus ? parseFloat(data.sign_bonus) : null;
        data.stipend_rate = data.stipend_rate
          ? parseFloat(data.stipend_rate)
          : null;
        data.client_standard_bill_rate = data.client_standard_bill_rate
          ? parseFloat(data.client_standard_bill_rate)
          : null;
        data.client_ot_bill_rate = data.client_ot_bill_rate
          ? parseFloat(data.client_ot_bill_rate)
          : null;
        data.client_holiday_bill_rate = data.client_holiday_bill_rate
          ? parseFloat(data.client_holiday_bill_rate)
          : null;

        try {
          const response = await fetch(`${API_URL}/candidates`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });

          if (!response.ok) {
            const error = await response.json();
            throw new Error(error.message || "Failed to add candidate");
          }

          alert("Candidate added successfully!");
          form.reset();
          await loadCandidates();
        } catch (error) {
          console.error("Error:", error);
          alert("Error: " + error.message);
        }
      });

      candidatesTable.addEventListener("click", async (event) => {
        const btn = event.target.closest('button[data-action="save-row"]');
        if (!btn) return;
        const tr = btn.closest("tr[data-row-index]");
        if (!tr) return;
        btn.disabled = true;
        btn.textContent = "Saving...";
        try {
          await saveCandidateRow(tr);
          btn.textContent = "Saved";
          setTimeout(() => {
            btn.textContent = "Save";
          }, 900);
        } catch (error) {
          candidatesStatus.textContent = `Error: ${error.message}`;
          btn.textContent = "Save";
        } finally {
          btn.disabled = false;
        }
      });

      loadCandidates().catch((error) => {
        candidatesStatus.textContent = `Error: ${error.message}`;
      });
    </script>
  </body>
</html>
