<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="login.html">Intuites Healthcare Staffing</a>
      </div>
    </header>

    <main class="container">
      <section class="card form-card auth-card" aria-labelledby="reset-title">
        <h1 id="reset-title">Reset Password</h1>
        <p id="resetHint" style="margin: 0 0 14px; color: #475569"></p>

        <form id="resetPasswordForm" class="grid-form auth-form">
          <div class="field" style="grid-column: 1 / -1">
            <label for="newPassword">New Password</label>
            <input
              id="newPassword"
              name="newPassword"
              type="password"
              placeholder="Enter new password"
              required
              minlength="8"
            />
          </div>

          <div class="field" style="grid-column: 1 / -1">
            <label for="confirmPassword">Confirm Password</label>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              placeholder="Confirm new password"
              required
              minlength="8"
            />
          </div>

          <div class="form-actions">
            <button id="resetPasswordBtn" type="submit" class="btn primary">
              Reset Password
            </button>
          </div>
        </form>

        <div class="auth-links">
          <a class="link-button" href="login.html">Back to login</a>
        </div>

        <p id="resetStatus" style="margin-top: 12px; color: #475569"></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">&copy; <span id="year"></span> Intuites Healthcare Staffing</div>
    </footer>

    <script type="module">
      import { resetPassword } from "./auth.js";

      document.getElementById("year").textContent = new Date().getFullYear();

      const form = document.getElementById("resetPasswordForm");
      const statusEl = document.getElementById("resetStatus");
      const hintEl = document.getElementById("resetHint");
      const resetBtn = document.getElementById("resetPasswordBtn");
      const newPasswordInput = document.getElementById("newPassword");
      const confirmPasswordInput = document.getElementById("confirmPassword");

      const params = new URLSearchParams(window.location.search);
      const token = params.get("token") || "";
      const email = params.get("email") || "";

      hintEl.textContent = email
        ? `Resetting password for ${email}`
        : "Open this page from the email reset link.";

      if (!token) {
        resetBtn.disabled = true;
        statusEl.style.color = "#b91c1c";
        statusEl.textContent = "Missing reset token.";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!token) return;

        const password = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        if (password !== confirmPassword) {
          statusEl.style.color = "#b91c1c";
          statusEl.textContent = "Passwords do not match.";
          return;
        }

        resetBtn.disabled = true;
        resetBtn.textContent = "Resetting...";
        statusEl.style.color = "#475569";
        statusEl.textContent = "Updating password...";

        try {
          const data = await resetPassword(token, password);
          statusEl.style.color = "#166534";
          statusEl.textContent =
            data?.message || "Password reset successfully. Redirecting to login...";
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        } catch (error) {
          statusEl.style.color = "#b91c1c";
          statusEl.textContent = error.message || "Failed to reset password";
        } finally {
          resetBtn.disabled = false;
          resetBtn.textContent = "Reset Password";
        }
      });
    </script>
  </body>
</html>
