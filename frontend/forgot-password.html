<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot Password</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="login.html">Intuites Healthcare Staffing</a>
      </div>
    </header>

    <main class="container">
      <section class="card form-card auth-card" aria-labelledby="forgot-title">
        <h1 id="forgot-title">Forgot Password</h1>
        <p style="margin: 0 0 14px; color: #475569">
          Enter your email address and we will send you a password reset link.
        </p>

        <form id="forgotPasswordForm" class="grid-form auth-form">
          <div class="field" style="grid-column: 1 / -1">
            <label for="resetLogin">Email Address</label>
            <input
              id="resetLogin"
              name="resetLogin"
              type="email"
              placeholder="Enter your email address"
              required
            />
          </div>

          <div class="form-actions">
            <button id="sendResetBtn" type="submit" class="btn primary">
              Send Reset Email
            </button>
          </div>
        </form>

        <div class="auth-links">
          <a href="login.html" class="link-button">Back to login</a>
        </div>

        <p id="forgotStatus" style="margin-top: 12px; color: #475569"></p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">&copy; <span id="year"></span>Intuites Healthcare Staffing</div>
    </footer>

    <script type="module">
      import { requestResetEmail } from "./auth.js";

      document.getElementById("year").textContent = new Date().getFullYear();

      const form = document.getElementById("forgotPasswordForm");
      const statusEl = document.getElementById("forgotStatus");
      const resetLoginInput = document.getElementById("resetLogin");
      const sendResetBtn = document.getElementById("sendResetBtn");
      const params = new URLSearchParams(window.location.search);
      const presetEmail = params.get("email");

      if (presetEmail) {
        resetLoginInput.value = presetEmail;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        sendResetBtn.disabled = true;
        sendResetBtn.textContent = "Sending...";
        statusEl.style.color = "#475569";
        statusEl.textContent = "Sending reset email...";

        try {
          const data = await requestResetEmail(resetLoginInput.value);
          statusEl.style.color = "#166534";
          statusEl.textContent = data?.email
            ? `Reset email sent to ${data.email}.`
            : data?.message || "If that account exists, a reset link has been sent.";
        } catch (error) {
          statusEl.style.color = "#b91c1c";
          statusEl.textContent = error.message || "Failed to send reset email";
        } finally {
          sendResetBtn.disabled = false;
          sendResetBtn.textContent = "Send Reset Email";
        }
      });
    </script>
  </body>
</html>
